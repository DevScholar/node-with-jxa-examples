<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; text-align: center; }
        h1 { color: #333; }
        #display { font-size: 24px; margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
    <script>
        // Forward console.log to the host so it shows up in the Node.js terminal.
        // WKWebView exposes message handlers via window.webkit.messageHandlers.
        (function() {
            const post = (level, args) => {
                try {
                    window.webkit.messageHandlers.console.postMessage(
                        (level ? '[' + level + '] ' : '') + args.join(' ')
                    );
                } catch (e) { /* host bridge missing — ignore */ }
            };
            const orig = window.console;
            window.console = {
                log:   (...args) => post('',      args),
                error: (...args) => post('ERROR', args),
                warn:  (...args) => post('WARN',  args),
            };
        })();
    </script>
</head>
<body>
    <h1>Counter App (WebKit)</h1>
    <p id="display">Clicks: 0</p>
    <button id="btn">Click to Add</button>

    <script>
        let clickCount = 0;
        const display = document.getElementById('display');
        const button = document.getElementById('btn');

        button.addEventListener('click', function() {
            clickCount++;
            const message = 'Button clicked ' + clickCount + ' times';
            display.textContent = message;
            console.log(message);
        });
    </script>
</body>
</html>
